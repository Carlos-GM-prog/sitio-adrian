<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Robledo | Música Oficial</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <img src="assets/portada.jpg" alt="Foto del Artista" class="profile-pic">
            <h1>Adrian Robledo</h1>
            <p>Música nueva disponible en todas las plataformas</p>
            
            <div class="social-links">
                <a href="https://spotify.com" target="_blank" class="btn spotify">Spotify</a>
                <a href="https://instagram.com" target="_blank" class="btn instagram">Instagram</a>
                <a href="https://youtube.com" target="_blank" class="btn youtube">YouTube</a>
            </div>
        </div>
    </header>

    <section class="music-section">
        <h2>Escuchá lo último</h2>
        
        <div class="track-card">
            <h3>Dios es mi Luz</h3>
            <audio controls preload="auto">
                <source src="https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg" type="audio/ogg">
                Tu navegador no soporta el reproductor de audio.
            </audio>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
